name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - run: npm run bench
        env:
          BENCH_ROWS: "40000"
          BENCH_COLS: "20"
